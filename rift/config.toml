# rift config
# Modeled after OmniWM settings.toml

[settings]
# Animations (matches OmniWM animationsEnabled = true)
animate = true
animation_duration = 0.3
animation_fps = 100.0

# Spaces are managed by default (OmniWM manages all spaces)
default_disable = false

# Mouse/Focus behavior
focus_follows_mouse = true
mouse_follows_focus = false
mouse_hides_on_focus = false

auto_focus_blacklist = []
run_on_start = []
hot_reload = true

[settings.layout]
# OmniWM defaultLayoutType = "niri" → Rift "scrolling"
mode = "scrolling"

[settings.layout.master_stack]
master_ratio = 0.6
master_count = 1
master_side = "left"
new_window_placement = "master"

[settings.layout.scrolling]
column_width_ratio = 0.5
min_column_width_ratio = 0.3333333333333333
max_column_width_ratio = 0.6666666666666666
alignment = "center"
focus_navigation_style = "anchored"

[settings.layout.scrolling.gestures]
enabled = false
invert_horizontal = false
fingers = 3
propagate_to_workspace_swipe = false

[settings.layout.stack]
stack_offset = 40.0
default_orientation = "perpendicular"

[settings.layout.gaps]
# OmniWM gaps.size = 20.0 (inner), gaps.outer = {top:10,left:10,bottom:9,right:10}
[settings.layout.gaps.inner]
horizontal = 20
vertical = 20

[settings.layout.gaps.outer]
top = 10
left = 10
bottom = 9
right = 10

[settings.ui.menu_bar]
# Closest match to OmniWM workspaceBar
enabled = true
show_empty = true
mode = "all"
active_label = "name"
display_style = "label"

[settings.ui.stack_line]
enabled = false
horiz_placement = "top"
vert_placement = "left"
thickness = 20.0
spacing = 1.0

[settings.ui.mission_control]
enabled = true
fade_enabled = true
fade_duration_ms = 180.0

[settings.gestures]
# OmniWM gestures: scrollEnabled = true, fingerCount = 3, invertDirection = true
enabled = true
invert_horizontal_swipe = true
swipe_vertical_tolerance = 0.4
skip_empty = true
fingers = 3
distance_pct = 0.08
haptics_enabled = true
haptic_pattern = "level_change"

[settings.window_snapping]
drag_swap_fraction = 0.3

[virtual_workspaces]
enabled = true
default_workspace_count = 9
auto_assign_windows = true
preserve_focus_per_workspace = true
workspace_auto_back_and_forth = false
reapply_app_rules_on_title_change = false

workspace_names = [
	"1", "2", "3", "4", "5", "6", "7", "8", "9"
]

# Workspace layout rules matching OmniWM
# 1 → dwindle (bsp), 2-7 → niri (scrolling), 8 → dwindle (bsp), 9 → default (traditional)
workspace_rules = [
  { workspace = "1", layout = "scrolling" },
  { workspace = "2", layout = "scrolling" },
  { workspace = "3", layout = "scrolling" },
  { workspace = "4", layout = "scrolling" },
  { workspace = "5", layout = "scrolling" },
  { workspace = "6", layout = "scrolling" },
  { workspace = "7", layout = "scrolling" },
  { workspace = "8", layout = "scrolling" },
  { workspace = "9", layout = "scrolling" }
]

# App rules (Rift supports workspace assignment / floating / manage only)
app_rules = [
  { app_id = "com.bitwarden.desktop", workspace = "1" }
]

[modifier_combinations]
comb1 = "Meta + Shift"

[keys]
# Space activation
"Meta + Z" = "toggle_space_activated"

# Focus (Hyper+HJKL)
"Meta + H" = { move_focus = "left" }
"Meta + J" = { move_focus = "down" }
"Meta + K" = { move_focus = "up" }
"Meta + L" = { move_focus = "right" }

# Focus previous (closest OmniWM equivalent is focusPrevious)
"Meta + Tab" = "switch_to_last_workspace"

# Move node / column (Hyper+Shift+HJKL)
"comb1 + H" = { move_node = "left" }
"comb1 + J" = { move_node = "down" }
"comb1 + K" = { move_node = "up" }
"comb1 + L" = { move_node = "right" }

# Workspace switching (Hyper+1..9)
"Meta + 1" = { switch_to_workspace = 0 }
"Meta + 2" = { switch_to_workspace = 1 }
"Meta + 3" = { switch_to_workspace = 2 }
"Meta + 4" = { switch_to_workspace = 3 }
"Meta + 5" = { switch_to_workspace = 4 }
"Meta + 6" = { switch_to_workspace = 5 }
"Meta + 7" = { switch_to_workspace = 6 }
"Meta + 8" = { switch_to_workspace = 7 }
"Meta + 9" = { switch_to_workspace = 8 }

# Move window to workspace (Hyper+Shift+1..9)
"comb1 + 1" = { move_window_to_workspace = 0 }
"comb1 + 2" = { move_window_to_workspace = 1 }
"comb1 + 3" = { move_window_to_workspace = 2 }
"comb1 + 4" = { move_window_to_workspace = 3 }
"comb1 + 5" = { move_window_to_workspace = 4 }
"comb1 + 6" = { move_window_to_workspace = 5 }
"comb1 + 7" = { move_window_to_workspace = 6 }
"comb1 + 8" = { move_window_to_workspace = 7 }
"comb1 + 9" = { move_window_to_workspace = 8 }

# Stack / join toggles (closest to OmniWM consume/expel)
"Meta + Comma" = "toggle_stack"
"Meta + Period" = "unjoin_windows"

# Fullscreen (Hyper+Shift+F → native fullscreen; Hyper+F → within gaps)
"Meta + Shift + F" = "toggle_fullscreen"
"Meta + F" = "toggle_fullscreen_within_gaps"

# Resize column width (closest to OmniWM setColumnWidth)
"Meta + Equal" = "resize_window_grow"
"Meta + Minus" = "resize_window_shrink"

# Floating toggle
"Meta + Shift + V" = "toggle_window_floating"

# Terminal
"Meta + Enter" = { exec = ["open", "-n", "/Volumes/Macintosh HD/Applications/Alacritty.app"] }

# Overview / Mission Control (OmniWM toggleOverview = Hyper+O)
"Meta + O" = "show_mission_control_all"

# Utility binds
"Alt + Shift + D" = "debug"
"Alt + Ctrl + S" = "serialize"
"Alt + Ctrl + Q" = "save_and_exit"
